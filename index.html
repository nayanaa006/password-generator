
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>🔐 Password Generator</h1>

            <button id="theme-toggle" aria-label="Switch theme">
                🌙
            </button>
        </header>

        <p class="subtitle">
            Create strong and secure passwords instantly.
        </p>

        <section class="password-box">

            <input
                type="text"
                id="password"
                placeholder="Your password will appear here"
                readonly
                aria-label="Generated password"
            >

            <button id="copy-btn">Copy</button>

        </section>

        <section class="settings">

            <div class="length-setting">
                <label for="length">
                    Password Length:
                    <span id="length-value">16</span>
                </label>

                <input
                    type="range"
                    id="length"
                    min="8"
                    max="32"
                    value="16"
                >
            </div>

            <h3>Password Requirements</h3>

            <label class="option">
                <input type="checkbox" id="uppercase" checked>
                Include Uppercase Letters (A-Z)
            </label>

            <label class="option">
                <input type="checkbox" id="lowercase" checked>
                Include Lowercase Letters (a-z)
            </label>

            <label class="option">
                <input type="checkbox" id="numbers" checked>
                Include Numbers (0-9)
            </label>

            <label class="option">
                <input type="checkbox" id="symbols" checked>
                Include Symbols (!@#$)
            </label>

        </section>

        <section class="strength-section">

            <p>Password Strength: <span id="strength">Not generated</span></p>

            <div class="strength-bar">
                <div id="strength-fill"></div>
            </div>

        </section>

        <button id="generate-btn">
            Generate Password
        </button>

        <p id="message" role="status"></p>

    </main>

    <script src="script.js"></script>

</body>
</html>
